<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#0a0a08"/>
  <!-- crosshair arms -->
  <line x1="2"  y1="16" x2="11" y2="16" stroke="#c8c8b4" stroke-width="1.5"/>
  <line x1="21" y1="16" x2="30" y2="16" stroke="#c8c8b4" stroke-width="1.5"/>
  <line x1="16" y1="2"  x2="16" y2="11" stroke="#c8c8b4" stroke-width="1.5"/>
  <line x1="16" y1="21" x2="16" y2="30" stroke="#c8c8b4" stroke-width="1.5"/>
  <!-- corner brackets -->
  <polyline points="4,10 4,4 10,4"   fill="none" stroke="#c8c8b4" stroke-width="1.5"/>
  <polyline points="22,4 28,4 28,10"  fill="none" stroke="#c8c8b4" stroke-width="1.5"/>
  <polyline points="4,22 4,28 10,28"  fill="none" stroke="#c8c8b4" stroke-width="1.5"/>
  <polyline points="28,22 28,28 22,28" fill="none" stroke="#c8c8b4" stroke-width="1.5"/>
  <!-- center dot -->
  <rect x="15" y="15" width="2" height="2" fill="#f0ede0"/>
</svg>
